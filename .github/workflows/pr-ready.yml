name: PR ready
run-name: 'PR #${{ inputs.pr_number }} checks passed (${{ inputs.head_sha }})'

# Subscribe the GitHub Slack app to this workflow's dispatch events. The gate
# dispatches only after validation; a skipped job would still notify on start.
# /github subscribe vercel-labs/postgresbuild workflows:{name:"PR ready" event:"workflow_dispatch"}
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Validated pull request
        required: true
        type: string
      head_sha:
        description: Validated PR head commit
        required: true
        type: string

permissions: {}

jobs:
  ready:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { notice } = require('./.github/scripts/pr-ready.cjs');
            await notice({ github, context, core });
