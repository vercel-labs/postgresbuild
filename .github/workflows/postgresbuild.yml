    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download canonical plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ggbuild-plan-v3
          path: .cache
      - name: Download prerequisite bundles
        if: matrix.has_bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: ggbuild-bundle-${{ matrix.target }}-*
          path: .cache/bundles
          merge-multiple: true
      - name: Restore exact bundle
        if: matrix.role == 'bundle' && env.GGBUILD_REF_OVERRIDE == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/bundles/${{ matrix.cache_key }}.tar.zst
          key: ${{ matrix.cache_key }}
      - name: Download root artifact
        if: matrix.role == 'test'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ matrix.input_artifact }}
          path: dist/${{ matrix.target }}/${{ matrix.version }}
      - name: Log in to GitHub Container Registry
        if: matrix.execution == 'docker' || matrix.bare_linux_test
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull Linux runtime-test image
        if: matrix.bare_linux_test
        run: docker pull "${{ matrix.test_image }}"
      - name: Get sccache credentials
        if: env.GGBUILD_ENABLE_SCCACHE == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            core.exportVariable(
              'ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable(
              'ACTIONS_RUNTIME_TOKEN',
              process.env.ACTIONS_RUNTIME_TOKEN || '');
      - uses: ./.github/actions/postgresbuild-setup
        if: matrix.execution == 'host' || matrix.bare_linux_test
      - name: Install requested ggbuild revision
        if: env.GGBUILD_REF_OVERRIDE != '' && (matrix.execution == 'host' || matrix.bare_linux_test)
        shell: bash
        run: |
          if [[ ! "$GGBUILD_REF_OVERRIDE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ggbuild_ref must be a full lowercase Git commit SHA" >&2
            exit 2
          fi
          python="$(
            uv run --no-sync python -c               'import sys; print(sys.executable)'
          )"
          uv pip install --python "$python"             "ggbuild @ git+https://github.com/vercel-labs/ggbuild@$GGBUILD_REF_OVERRIDE"
      - name: Execute node on host
        if: matrix.execution == 'host' && !matrix.bare_linux_test
        env:
          ACTIONS_CACHE_SERVICE_V2: on
          SCCACHE_GHA_ENABLED: on
        run: >-
          uv run ggbuild ci execute-node
          --plan .cache/ggbuild-plan.json
          --node "${{ matrix.node }}"
          --bundle-dir .cache
          --output-dir dist
          --work-dir .cache/work
          --max-parallel 1
          --exact
      - name: Execute Linux test node
        if: matrix.bare_linux_test
        run: >-
          uv run ggbuild ci execute-node
          --plan .cache/ggbuild-plan.json
          --node "${{ matrix.node }}"
          --bundle-dir .cache
          --output-dir dist
          --work-dir .cache/work
          --max-parallel 1
          --exact
          --bare-linux-test
      - name: Execute node in Linux image
        if: matrix.execution == 'docker' && !matrix.bare_linux_test
        env:
          ACTIONS_CACHE_SERVICE_V2: on
          GGBUILD_REF: ${{ env.GGBUILD_REF }}
          SCCACHE_GHA_ENABLED: on
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/github/workspace"
          --workdir /github/workspace
          --env GGBUILD_REF
          --env GGBUILD_ENABLE_SCCACHE
          --env ACTIONS_CACHE_SERVICE_V2
          --env ACTIONS_RESULTS_URL
          --env ACTIONS_RUNTIME_TOKEN
          --env SCCACHE_GHA_ENABLED
          "${{ matrix.build_image }}"
          ci execute-node
          --plan .cache/ggbuild-plan.json
          --node "${{ matrix.node }}"
          --bundle-dir .cache
          --output-dir dist
          --work-dir .cache/work
          --max-parallel 1
          --exact
          --prepared-target "${{ matrix.target }}"
      - name: Upload bundle
        if: matrix.role == 'bundle'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.bundle_artifact }}
          path: .cache/bundles/${{ matrix.cache_key }}.tar.zst
          if-no-files-found: error
          retention-days: 1
      - name: Upload root artifact
        if: matrix.role == 'artifact'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.upload_name }}
          path: dist/${{ matrix.target }}/${{ matrix.version }}/
          if-no-files-found: error
          retention-days: ${{ matrix.temporary_upload && 1 || 90 }}
      - name: Publish tested root artifact
        if: matrix.role == 'test' && matrix.publish_root
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.upload_name }}
          path: dist/${{ matrix.target }}/${{ matrix.version }}/
          if-no-files-found: error
          retention-days: 1


  publish:
    name: Publish immutable snapshot
    if: success() && github.repository == 'vercel-labs/postgresbuild' && (github.event_name != 'workflow_dispatch' || inputs.operation == 'build-and-publish') && (github.event_name != 'workflow_dispatch' || inputs.ggbuild_ref == '') && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    needs: [planning, nodes_aarch64_apple_darwin_0, nodes_aarch64_unknown_linux_gnu_0, nodes_aarch64_unknown_linux_musl_0, nodes_x86_64_unknown_linux_gnu_0, nodes_x86_64_unknown_linux_musl_0, nodes_aarch64_apple_darwin_1, nodes_aarch64_unknown_linux_gnu_1, nodes_aarch64_unknown_linux_musl_1, nodes_x86_64_unknown_linux_gnu_1, nodes_x86_64_unknown_linux_musl_1, nodes_aarch64_apple_darwin_2, nodes_aarch64_unknown_linux_gnu_2, nodes_aarch64_unknown_linux_musl_2, nodes_x86_64_unknown_linux_gnu_2, nodes_x86_64_unknown_linux_musl_2, nodes_aarch64_apple_darwin_3, nodes_aarch64_unknown_linux_gnu_3, nodes_aarch64_unknown_linux_musl_3, nodes_x86_64_unknown_linux_gnu_3, nodes_x86_64_unknown_linux_musl_3, nodes_aarch64_apple_darwin_4, nodes_aarch64_unknown_linux_gnu_4, nodes_aarch64_unknown_linux_musl_4, nodes_x86_64_unknown_linux_gnu_4, nodes_x86_64_unknown_linux_musl_4]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/postgresbuild-setup
      - name: Download canonical plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ggbuild-plan-v3
          path: .cache
      - name: Download every planned root
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: ggbuild-publication-*
          path: .cache/publication
      - name: Publish GitHub snapshot
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          uv run ggbuild ci publish-github
          --plan .cache/ggbuild-plan.json
          --artifacts .cache/publication
          --github-output "$GITHUB_OUTPUT"

      - name: Ingest published snapshot index
        if: steps.publish.outputs.published == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PUBLICATION_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLICATION_INDEX_URL: https://postgresbuild.labs.vercel.dev/api/publication
          PUBLICATION_REPOSITORY: vercel-labs/postgresbuild
          PUBLICATION_TAG: ${{ steps.publish.outputs.tag }}
        with:
          script: |
            const token = await core.getIDToken(
              process.env.PUBLICATION_INDEX_URL);
            const response = await fetch(process.env.PUBLICATION_INDEX_URL, {
              method: 'POST',
              headers: {
                authorization: `Bearer ${token}`,
                'content-type': 'application/json',
                'x-github-token': process.env.PUBLICATION_GITHUB_TOKEN,
              },
              body: JSON.stringify({
                repository: process.env.PUBLICATION_REPOSITORY,
                tag: process.env.PUBLICATION_TAG,
              }),
            });
            if (!response.ok) {
              const detail = await response.text();
              throw new Error(
                `index ingestion failed: ${response.status} ${detail}`);
            }
            const result = await response.json();
            if (result.ignored === true) {
              throw new Error('index ingestion was ignored');
            }


  ingest_existing:
    name: Ingest existing immutable release
    if: >-
      github.repository == 'vercel-labs/postgresbuild' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'ingest-existing' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate release tag
        env:
          PUBLICATION_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$PUBLICATION_TAG" =~ ^[0-9]{12}$ ]]; then
            echo "ingest-existing requires a twelve-digit tag" >&2
            exit 1
          fi

      - name: Ingest published snapshot index
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PUBLICATION_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLICATION_INDEX_URL: https://postgresbuild.labs.vercel.dev/api/publication
          PUBLICATION_REPOSITORY: vercel-labs/postgresbuild
          PUBLICATION_TAG: ${{ inputs.tag }}
        with:
          script: |
            const token = await core.getIDToken(
              process.env.PUBLICATION_INDEX_URL);
            const response = await fetch(process.env.PUBLICATION_INDEX_URL, {
              method: 'POST',
              headers: {
                authorization: `Bearer ${token}`,
                'content-type': 'application/json',
                'x-github-token': process.env.PUBLICATION_GITHUB_TOKEN,
              },
              body: JSON.stringify({
                repository: process.env.PUBLICATION_REPOSITORY,
                tag: process.env.PUBLICATION_TAG,
              }),
            });
            if (!response.ok) {
              const detail = await response.text();
              throw new Error(
                `index ingestion failed: ${response.status} ${detail}`);
            }
            const result = await response.json();
            if (result.ignored === true) {
              throw new Error('index ingestion was ignored');
            }
