          --env ACTIONS_RUNTIME_TOKEN
          --env SCCACHE_GHA_ENABLED
          "${{ matrix.build_image }}"
          ci execute-node
          --plan .cache/ggbuild-plan.json
          --node "${{ matrix.node }}"
          --bundle-dir .cache
          --output-dir dist
          --work-dir .cache/work
          --max-parallel 1
          --exact
          --prepared-target "${{ matrix.target }}"
      - name: Upload bundle
        if: matrix.role == 'bundle'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.bundle_artifact }}
          path: .cache/bundles/${{ matrix.cache_key }}.tar.zst
          if-no-files-found: error
          retention-days: 1
      - name: Upload root artifact
        if: matrix.role == 'artifact'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.upload_name }}
          path: dist/${{ matrix.target }}/${{ matrix.version }}/
          if-no-files-found: error
          retention-days: ${{ matrix.temporary_upload && 1 || 90 }}
      - name: Publish tested root artifact
        if: matrix.role == 'test' && matrix.publish_root
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.upload_name }}
          path: dist/${{ matrix.target }}/${{ matrix.version }}/
          if-no-files-found: error
          retention-days: 1


  publish:
    name: Publish immutable snapshot
    if: success() && github.repository == 'vercel-labs/postgresbuild' && (github.event_name != 'workflow_dispatch' || inputs.operation == 'build-and-publish') && (github.event_name != 'workflow_dispatch' || inputs.ggbuild_ref == '') && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    needs: [planning, nodes_aarch64_apple_darwin_0, nodes_aarch64_unknown_linux_gnu_0, nodes_aarch64_unknown_linux_musl_0, nodes_x86_64_unknown_linux_gnu_0, nodes_x86_64_unknown_linux_musl_0, nodes_aarch64_apple_darwin_1, nodes_aarch64_unknown_linux_gnu_1, nodes_aarch64_unknown_linux_musl_1, nodes_x86_64_unknown_linux_gnu_1, nodes_x86_64_unknown_linux_musl_1, nodes_aarch64_apple_darwin_2, nodes_aarch64_unknown_linux_gnu_2, nodes_aarch64_unknown_linux_musl_2, nodes_x86_64_unknown_linux_gnu_2, nodes_x86_64_unknown_linux_musl_2, nodes_aarch64_apple_darwin_3, nodes_aarch64_unknown_linux_gnu_3, nodes_aarch64_unknown_linux_musl_3, nodes_x86_64_unknown_linux_gnu_3, nodes_x86_64_unknown_linux_musl_3, nodes_aarch64_apple_darwin_4, nodes_aarch64_unknown_linux_gnu_4, nodes_aarch64_unknown_linux_musl_4, nodes_x86_64_unknown_linux_gnu_4, nodes_x86_64_unknown_linux_musl_4]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/postgresbuild-setup
      - name: Download canonical plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ggbuild-plan-v3
          path: .cache
      - name: Download every planned root
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: ggbuild-publication-*
          path: .cache/publication
      - name: Publish GitHub snapshot
        id: publish
        env:
          EXPECTED_PUBLICATION_TAG: >-
            ${{ needs.planning.outputs.publication_tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          uv run ggbuild ci publish-github
          --plan .cache/ggbuild-plan.json
          --artifacts .cache/publication
          --expected-tag "$EXPECTED_PUBLICATION_TAG"
          --github-output "$GITHUB_OUTPUT"

      - name: Ingest published snapshot index
        if: steps.publish.outputs.published == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PUBLICATION_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLICATION_INDEX_URL: https://postgresbuild.labs.vercel.dev/api/publication
          PUBLICATION_REPOSITORY: vercel-labs/postgresbuild
          PUBLICATION_TAG: ${{ steps.publish.outputs.tag }}
        with:
          script: |
            const token = await core.getIDToken(
              process.env.PUBLICATION_INDEX_URL);
            const response = await fetch(process.env.PUBLICATION_INDEX_URL, {
              method: 'POST',
              headers: {
                authorization: `Bearer ${token}`,
                'content-type': 'application/json',
                'x-github-token': process.env.PUBLICATION_GITHUB_TOKEN,
              },
              body: JSON.stringify({
                repository: process.env.PUBLICATION_REPOSITORY,
                tag: process.env.PUBLICATION_TAG,
              }),
            });
            if (!response.ok) {
              const detail = await response.text();
              throw new Error(
                `index ingestion failed: ${response.status} ${detail}`);
            }
            const result = await response.json();
            if (result.ignored === true) {
              throw new Error('index ingestion was ignored');
            }


  ingest_existing:
    name: Ingest existing immutable release
    if: >-
      github.repository == 'vercel-labs/postgresbuild' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'ingest-existing' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate release tag
        env:
          PUBLICATION_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$PUBLICATION_TAG" =~ ^[0-9]{12}$ ]]; then
            echo "ingest-existing requires a twelve-digit tag" >&2
            exit 1
          fi

      - name: Ingest published snapshot index
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PUBLICATION_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLICATION_INDEX_URL: https://postgresbuild.labs.vercel.dev/api/publication
          PUBLICATION_REPOSITORY: vercel-labs/postgresbuild
          PUBLICATION_TAG: ${{ inputs.tag }}
        with:
          script: |
            const token = await core.getIDToken(
              process.env.PUBLICATION_INDEX_URL);
            const response = await fetch(process.env.PUBLICATION_INDEX_URL, {
              method: 'POST',
              headers: {
                authorization: `Bearer ${token}`,
                'content-type': 'application/json',
                'x-github-token': process.env.PUBLICATION_GITHUB_TOKEN,
              },
              body: JSON.stringify({
                repository: process.env.PUBLICATION_REPOSITORY,
                tag: process.env.PUBLICATION_TAG,
              }),
            });
            if (!response.ok) {
              const detail = await response.text();
              throw new Error(
                `index ingestion failed: ${response.status} ${detail}`);
            }
            const result = await response.json();
            if (result.ignored === true) {
              throw new Error('index ingestion was ignored');
            }
