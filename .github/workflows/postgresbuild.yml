        with:
          name: ${{ matrix.input_artifact }}
          path: dist/${{ matrix.target }}/${{ matrix.version }}
      - name: Log in to GitHub Container Registry
        if: matrix.execution == 'docker' || matrix.bare_linux_test
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull Linux runtime-test image
        if: matrix.bare_linux_test
        env:
          GGBUILD_TEST_IMAGE: ${{ matrix.test_image }}
        run: docker pull "$GGBUILD_TEST_IMAGE"
      - name: Get sccache credentials
        if: env.GGBUILD_ENABLE_SCCACHE == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            core.exportVariable(
              'ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable(
              'ACTIONS_RUNTIME_TOKEN',
              process.env.ACTIONS_RUNTIME_TOKEN || '');
      - uses: ./.github/actions/postgresbuild-setup
        if: matrix.execution == 'host' || matrix.bare_linux_test
      - name: Install requested ggbuild revision
        if: env.GGBUILD_REF_OVERRIDE != '' && (matrix.execution == 'host' || matrix.bare_linux_test)
        shell: bash
        run: |
          if [[ ! "$GGBUILD_REF_OVERRIDE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ggbuild_ref must be a full lowercase Git commit SHA" >&2
            exit 2
          fi
          python="$(
            uv run --no-sync python -c               'import sys; print(sys.executable)'
          )"
          uv pip install --python "$python"             "ggbuild @ git+https://github.com/vercel-labs/ggbuild@$GGBUILD_REF_OVERRIDE"
      - name: Execute node on host
        if: matrix.execution == 'host' && !matrix.bare_linux_test
        env:
          ACTIONS_CACHE_SERVICE_V2: on
          SCCACHE_GHA_ENABLED: on
          GGBUILD_NODE: ${{ matrix.node }}
        run: >-
          uv run ggbuild ci execute-node
          --plan .cache/ggbuild-plan.json
          --node "$GGBUILD_NODE"
          --bundle-dir .cache
          --output-dir dist
          --work-dir .cache/work
          --max-parallel 1
          --exact
      - name: Execute Linux test node
        if: matrix.bare_linux_test
        env:
          GGBUILD_NODE: ${{ matrix.node }}
        run: >-
          uv run ggbuild ci execute-node
          --plan .cache/ggbuild-plan.json
          --node "$GGBUILD_NODE"
          --bundle-dir .cache
          --output-dir dist
          --work-dir .cache/work
          --max-parallel 1
          --exact
          --bare-linux-test
      - name: Execute node in Linux image
        if: matrix.execution == 'docker' && !matrix.bare_linux_test
        env:
          ACTIONS_CACHE_SERVICE_V2: on
          GGBUILD_REF: ${{ env.GGBUILD_REF }}
          SCCACHE_GHA_ENABLED: on
          GGBUILD_NODE: ${{ matrix.node }}
          GGBUILD_TARGET: ${{ matrix.target }}
          GGBUILD_BUILD_IMAGE: ${{ matrix.build_image }}
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/github/workspace"
          --workdir /github/workspace
          --env GGBUILD_REF
          --env GGBUILD_ENABLE_SCCACHE
          --env GGBUILD_PUBLICATION_TAG
          --env ACTIONS_CACHE_SERVICE_V2
          --env ACTIONS_RESULTS_URL
          --env ACTIONS_RUNTIME_TOKEN
          --env SCCACHE_GHA_ENABLED
          "$GGBUILD_BUILD_IMAGE"
          ci execute-node
          --plan .cache/ggbuild-plan.json
          --node "$GGBUILD_NODE"
          --bundle-dir .cache
