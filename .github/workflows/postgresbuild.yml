            cache_key: "ggbuild-v3-0fcb6ad0079a8b8f25107defc8005a5b05704d8978663956c7f9f1ac32975732"
            bundle_artifact: "ggbuild-bundle-x86_64-unknown-linux-gnu-0fcb6ad0079a8b8f25107defc8005a5b05704d8978663956c7f9f1ac32975732"
            has_bundles: true
            bare_linux_test: false
            build_image: "ghcr.io/vercel-labs/ggbuild/linux-gnu:sha256-319f1410f4d5521f1f337475764277bc4ee842f2e3a83bbbff9790002554c500"
            test_image: ""
            input_artifact: ""
            upload_name: ""
            temporary_upload: false
          - node: "bundle_x86_64_unknown_linux_musl_libxslt_1_1_45"
            target: "x86_64-unknown-linux-musl"
            runner: "ubuntu-latest"
            execution: "docker"
            role: "bundle"
