# Generated by `ggbuild ci render-workflow`; do not edit.
name: PostgreSQL builds

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build a new snapshot or ingest an existing release
        type: choice
        options:
          - build-and-publish
          - ingest-existing
        default: build-and-publish
      tag:
        description: Twelve-digit release tag for ingest-existing
        type: string
        required: false
      enable_sccache:
        description: Enable sccache for intermediate object files
        type: boolean
        default: false
      ggbuild_ref:
        description: Full ggbuild commit SHA to test; empty uses the pin
        type: string
        required: false
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GGBUILD_ENABLE_SCCACHE: ${{ (github.event_name == 'workflow_dispatch' && inputs.enable_sccache) || (github.event_name == 'pull_request' && true) || (github.event_name == 'push' && false) }}
  GGBUILD_REF: ${{ (github.event_name == 'workflow_dispatch' && inputs.ggbuild_ref) || 'a8fced0f3a0b6ebcab8a5f14fac6662ae615aa6e' }}
  GGBUILD_REF_OVERRIDE: ${{ (github.event_name == 'workflow_dispatch' && inputs.ggbuild_ref) || '' }}
  UV_NO_SYNC: ${{ github.event_name == 'workflow_dispatch' && inputs.ggbuild_ref != '' }}

jobs:
  planning:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.operation != 'ingest-existing'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      publication_tag: ${{ steps.publication_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/postgresbuild-setup
      - name: Create canonical build plan
        run: >-
          uv run ggbuild ci plan
          --expected-digest 56c00bbb89297dbb32bf324377da17f61e273d3b59460d23e978545b4d7c9b6a
          --output .cache/ggbuild-plan.json
      - name: Resolve publication tag
        if: >-
          github.repository == 'vercel-labs/postgresbuild' && (github.event_name != 'workflow_dispatch' || inputs.operation == 'build-and-publish') && (github.event_name != 'workflow_dispatch' || inputs.ggbuild_ref == '') && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
        id: publication_tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          uv run ggbuild ci publication-tag
          --github-output "$GITHUB_OUTPUT"
      - name: Upload canonical plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ggbuild-plan-v3
          path: .cache/ggbuild-plan.json
          if-no-files-found: error
          retention-days: 1

