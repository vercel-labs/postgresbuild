        if: matrix.has_bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: ggbuild-bundle-${{ matrix.target }}-*
          path: .cache/bundles
