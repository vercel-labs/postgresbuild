        with:
          persist-credentials: false
      - uses: ./.github/actions/postgresbuild-setup
      - name: Create canonical build plan
        run: >-
          uv run ggbuild ci plan
          --expected-digest 0424fba1000f8e5e0805100e461524cf0366b336a529c775abad1791c52aa61f
          --output .cache/ggbuild-plan.json
      - name: Upload canonical plan
