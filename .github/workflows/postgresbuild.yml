# Generated by `ggbuild ci render-workflow`; do not edit.
name: PostgreSQL builds

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  planning:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/postgresbuild-setup
      - id: plan
        name: Create runtime build plan
        run: >-
          uv run ggbuild ci plan
          --output .cache/ggbuild-plan.json
          --github-output "$GITHUB_OUTPUT"
      - name: Upload canonical plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ggbuild-plan-v3
          path: .cache/ggbuild-plan.json
          if-no-files-found: error
          retention-days: 1

  build:
    needs: [planning]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.planning.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/postgresbuild-setup
        if: matrix.execution == 'host'
      - name: Download canonical plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ggbuild-plan-v3
          path: .cache
      - name: Restore exact bundle closure
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            .cache/bundles
            .cache/uv
          key: ggbuild-v3-${{ matrix.target }}-${{ matrix.closure_digest }}
          restore-keys: |
            ggbuild-v3-${{ matrix.target }}-
      - name: Build host root closure
        if: matrix.execution == 'host'
        run: >-
          uv run ggbuild ci execute-node
          --plan .cache/ggbuild-plan.json
          --node "${{ matrix.node_id }}"
          --bundle-dir .cache
          --output-dir dist
          --work-dir .cache/work
          --max-parallel 4
      - name: Build root closure in x86_64-unknown-linux-gnu
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: docker://ghcr.io/vercel-labs/ggbuild/linux-gnu:sha256-05f5071a5459028aca2764ce2db1ec2cb14bea52615498fcb053782f9789b9d6
        env:
          GGBUILD_REF: f47dff7277b74dfbd36838506a05a5e7732d8424
        with:
          args: >-
            ci execute-node
            --plan .cache/ggbuild-plan.json
            --node ${{ matrix.node_id }}
            --bundle-dir .cache
            --output-dir dist
            --work-dir .cache/work
            --max-parallel 4
            --prepared-target x86_64-unknown-linux-gnu
      - name: Build root closure in aarch64-unknown-linux-gnu
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: docker://ghcr.io/vercel-labs/ggbuild/linux-gnu:sha256-05f5071a5459028aca2764ce2db1ec2cb14bea52615498fcb053782f9789b9d6
        env:
          GGBUILD_REF: f47dff7277b74dfbd36838506a05a5e7732d8424
        with:
          args: >-
            ci execute-node
            --plan .cache/ggbuild-plan.json
            --node ${{ matrix.node_id }}
            --bundle-dir .cache
            --output-dir dist
            --work-dir .cache/work
            --max-parallel 4
            --prepared-target aarch64-unknown-linux-gnu
      - name: Build root closure in x86_64-unknown-linux-musl
        if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: docker://ghcr.io/vercel-labs/ggbuild/linux-musl:sha256-c530c440a922606a75d9b85e777ecdb6c7073f651f9dee3d40677429b60eeb6d
        env:
          GGBUILD_REF: f47dff7277b74dfbd36838506a05a5e7732d8424
        with:
          args: >-
            ci execute-node
            --plan .cache/ggbuild-plan.json
            --node ${{ matrix.node_id }}
            --bundle-dir .cache
            --output-dir dist
            --work-dir .cache/work
            --max-parallel 4
            --prepared-target x86_64-unknown-linux-musl
      - name: Build root closure in aarch64-unknown-linux-musl
        if: matrix.target == 'aarch64-unknown-linux-musl'
        uses: docker://ghcr.io/vercel-labs/ggbuild/linux-musl:sha256-c530c440a922606a75d9b85e777ecdb6c7073f651f9dee3d40677429b60eeb6d
        env:
          GGBUILD_REF: f47dff7277b74dfbd36838506a05a5e7732d8424
        with:
          args: >-
            ci execute-node
            --plan .cache/ggbuild-plan.json
            --node ${{ matrix.node_id }}
            --bundle-dir .cache
            --output-dir dist
            --work-dir .cache/work
            --max-parallel 4
            --prepared-target aarch64-unknown-linux-musl
      - name: Upload tested root artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.target }}/${{ matrix.version }}/
          if-no-files-found: error
