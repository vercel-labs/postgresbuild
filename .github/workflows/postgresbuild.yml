# Generated by `ggbuild ci render-workflow`; do not edit.
name: PostgreSQL builds

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build a new snapshot or ingest an existing release
        type: choice
        options:
          - build-and-publish
          - ingest-existing
        default: build-and-publish
      tag:
        description: Twelve-digit release tag for ingest-existing
        type: string
        required: false
      enable_sccache:
        description: Enable sccache for intermediate object files
        type: boolean
        default: false
      ggbuild_ref:
        description: Full ggbuild commit SHA to test; empty uses the pin
        type: string
        required: false
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GGBUILD_ENABLE_SCCACHE: ${{ (github.event_name == 'workflow_dispatch' && inputs.enable_sccache) || (github.event_name == 'pull_request' && true) || (github.event_name == 'push' && false) }}
  GGBUILD_REF: ${{ (github.event_name == 'workflow_dispatch' && inputs.ggbuild_ref) || '2c669089ced557cf72c9e9f3f0de69be97ee4f0b' }}
  GGBUILD_REF_OVERRIDE: ${{ (github.event_name == 'workflow_dispatch' && inputs.ggbuild_ref) || '' }}
  UV_NO_SYNC: ${{ github.event_name == 'workflow_dispatch' && inputs.ggbuild_ref != '' }}

jobs:
  planning:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.operation != 'ingest-existing'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      nodes_aarch64_apple_darwin_0: ${{ steps.plan.outputs.nodes_aarch64_apple_darwin_0 }}
      nodes_aarch64_unknown_linux_gnu_0: ${{ steps.plan.outputs.nodes_aarch64_unknown_linux_gnu_0 }}
      nodes_aarch64_unknown_linux_musl_0: ${{ steps.plan.outputs.nodes_aarch64_unknown_linux_musl_0 }}
      nodes_x86_64_unknown_linux_gnu_0: ${{ steps.plan.outputs.nodes_x86_64_unknown_linux_gnu_0 }}
      nodes_x86_64_unknown_linux_musl_0: ${{ steps.plan.outputs.nodes_x86_64_unknown_linux_musl_0 }}
      nodes_aarch64_apple_darwin_1: ${{ steps.plan.outputs.nodes_aarch64_apple_darwin_1 }}
      nodes_aarch64_unknown_linux_gnu_1: ${{ steps.plan.outputs.nodes_aarch64_unknown_linux_gnu_1 }}
      nodes_aarch64_unknown_linux_musl_1: ${{ steps.plan.outputs.nodes_aarch64_unknown_linux_musl_1 }}
      nodes_x86_64_unknown_linux_gnu_1: ${{ steps.plan.outputs.nodes_x86_64_unknown_linux_gnu_1 }}
      nodes_x86_64_unknown_linux_musl_1: ${{ steps.plan.outputs.nodes_x86_64_unknown_linux_musl_1 }}
      nodes_aarch64_apple_darwin_2: ${{ steps.plan.outputs.nodes_aarch64_apple_darwin_2 }}
      nodes_aarch64_unknown_linux_gnu_2: ${{ steps.plan.outputs.nodes_aarch64_unknown_linux_gnu_2 }}
      nodes_aarch64_unknown_linux_musl_2: ${{ steps.plan.outputs.nodes_aarch64_unknown_linux_musl_2 }}
      nodes_x86_64_unknown_linux_gnu_2: ${{ steps.plan.outputs.nodes_x86_64_unknown_linux_gnu_2 }}
      nodes_x86_64_unknown_linux_musl_2: ${{ steps.plan.outputs.nodes_x86_64_unknown_linux_musl_2 }}
      nodes_aarch64_apple_darwin_3: ${{ steps.plan.outputs.nodes_aarch64_apple_darwin_3 }}
      nodes_aarch64_unknown_linux_gnu_3: ${{ steps.plan.outputs.nodes_aarch64_unknown_linux_gnu_3 }}
      nodes_aarch64_unknown_linux_musl_3: ${{ steps.plan.outputs.nodes_aarch64_unknown_linux_musl_3 }}
      nodes_x86_64_unknown_linux_gnu_3: ${{ steps.plan.outputs.nodes_x86_64_unknown_linux_gnu_3 }}
      nodes_x86_64_unknown_linux_musl_3: ${{ steps.plan.outputs.nodes_x86_64_unknown_linux_musl_3 }}
      nodes_aarch64_apple_darwin_4: ${{ steps.plan.outputs.nodes_aarch64_apple_darwin_4 }}
      nodes_aarch64_unknown_linux_gnu_4: ${{ steps.plan.outputs.nodes_aarch64_unknown_linux_gnu_4 }}
      nodes_aarch64_unknown_linux_musl_4: ${{ steps.plan.outputs.nodes_aarch64_unknown_linux_musl_4 }}
      nodes_x86_64_unknown_linux_gnu_4: ${{ steps.plan.outputs.nodes_x86_64_unknown_linux_gnu_4 }}
      nodes_x86_64_unknown_linux_musl_4: ${{ steps.plan.outputs.nodes_x86_64_unknown_linux_musl_4 }}
      publication_tag: ${{ steps.publication_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/postgresbuild-setup
      - name: Create canonical build plan
        id: plan
        run: >-
          uv run ggbuild ci plan
          --expected-topology-digest 6ad830c82019c7e651c0d1b9f03f5fa1fee351d7cfed8e252cb672294e063bd6
          --output .cache/ggbuild-plan.json
          --github-node-matrices-output "$GITHUB_OUTPUT"
      - name: Resolve publication tag
        if: >-
          github.repository == 'vercel-labs/postgresbuild' && (github.event_name != 'workflow_dispatch' || inputs.operation == 'build-and-publish') && (github.event_name != 'workflow_dispatch' || inputs.ggbuild_ref == '') && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
        id: publication_tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          uv run ggbuild ci publication-tag
          --github-output "$GITHUB_OUTPUT"
      - name: Upload canonical plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ggbuild-plan-v3
          path: .cache/ggbuild-plan.json
          if-no-files-found: error
          retention-days: 1

